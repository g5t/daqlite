workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

default:
  tags:
    - docker

stages:
  - setup
  - build
  - publish

variables:
  UBUNTU2204_QT6_IMAGE: "registry.esss.lu.se/ecdc/ess-dmsc/build-nodes/ubuntu2204-qt6:1.1"
  ALMALINUX9_IMAGE: "registry.esss.lu.se/ecdc/ess-dmsc/docker-almalinux9-conan:1.5.0-rc.1"
  CONAN_USER_HOME: "$CI_PROJECT_DIR"

conan_setup:
  stage: setup
  image: $UBUNTU2204_QT6_IMAGE
  script:
    - conan config install https://github.com/ess-dmsc/conan-configuration.git
    - mkdir -p build
    - cd build
    - conan install .. --build=missing --build=librdkafka --profile=linux_x86_64_gcc11
  artifacts:
    paths:
      - .conan/
      - build/
    expire_in: 1 hour
    when: always

cppcheck:
  stage: setup
  image: python:3-alpine
  before_script:
    - apk add --no-cache cppcheck
    - pip install --no-cache-dir cppcheck-codequality
  script:
    # Collect C/C++ source files from src, excluding:
    #   - test files from test dirs and Test files)
    #   - fylgje
    - |
      find src/ -type f \
        \( -name '*.cpp' -o -name '*.c' -o -name '*.h' \) \
        ! -path '*/test/*' \
        ! -name '*Test*' \
        ! -path '*/fylgje/*' \
        > cppcheck_files.txt
    - cppcheck --xml-version=2 --enable=all --inconclusive --std=c++17 --language=c++ --library=qt --suppressions-list=cppcheck-suppressions.txt --file-list=cppcheck_files.txt 2> cppcheck.xml
    - cppcheck-codequality --input-file cppcheck.xml --output-file codequality.json
  artifacts:
    reports:
      codequality: codequality.json
    paths:
      - cppcheck.xml
      - codequality.json
    expire_in: 1 week

build:
  stage: build
  image: $UBUNTU2204_QT6_IMAGE
  needs:
    - conan_setup
    - cppcheck
  dependencies:
    - conan_setup
  script:
      - cd build
      - cmake ..
      - make -j$(nproc)
  artifacts:
    paths:
      - build/bin
      - build/lib
      - build/licenses
    expire_in: 1 week

publish-to-artifactory:
  stage: publish
  image: alpine/curl:latest
  dependencies:
    - build
  before_script:
    - curl -fL https://install-cli.jfrog.io | sh
    - jf config add $ESS_ARTIFACTORY_ID --url=$ESS_ARTIFACTORY_URL --user=$ESS_ARTIFACTORY_ECDC_USER --password=$ESS_ARTIFACTORY_ECDC_GENERIC_TOKEN
    - jf config show
  script:
    - mkdir -p archive/daqlite-ubuntu2204
    - cp -r build/bin archive/daqlite-ubuntu2204
    - cp -r build/lib archive/daqlite-ubuntu2204
    - cp -r scripts archive/daqlite-ubuntu2204
    - cp -r configs archive/daqlite-ubuntu2204
    - tar czvf daqlite-ubuntu2204.tar.gz -C archive daqlite-ubuntu2204
    - jf rt u --build-name="daqlite-ubuntu2204" --build-number=${CI_JOB_ID} daqlite-ubuntu2204.tar.gz ecdc-generic-release/${ARTIFACTORY_UPLOAD_PATH}
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      variables:
        ARTIFACTORY_UPLOAD_PATH: "${CI_PROJECT_NAME}/${CI_DEFAULT_BRANCH}/${CI_PIPELINE_IID}/"
    - if: $CI_COMMIT_TAG
      variables:
        ARTIFACTORY_UPLOAD_PATH: "${CI_PROJECT_NAME}/tags/${CI_COMMIT_TAG}/"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never

trigger-efu-devtools:
  stage: publish
  needs:
    - publish-to-artifactory
  trigger:
    project: ecdc/ess-dmsc/docker-efu-devtools
    branch: main
  variables:
    DAQLITE_BUILD_ID: "${CI_PIPELINE_IID}"
    DAQLITE_TARBALL_PATH: "${CI_PROJECT_NAME}/${CI_DEFAULT_BRANCH}/${CI_PIPELINE_IID}/daqlite-ubuntu2204.tar.gz"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
